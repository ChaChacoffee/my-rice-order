<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>สั่งข้าวเหนียว</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <main class="container">

    <header class="hero">

      <h1>🍚 สั่งข้าวเหนียว</h1>

      <p>
        เลือกเมนูที่ต้องการ
      </p>

    </header>


    <!-- ========================= -->
    <!-- รายการอาหาร -->
    <!-- ========================= -->

    <section class="card">

      <h2>🛒 รายการอาหาร</h2>

      <div id="items"></div>


      <button
        id="addItemBtn"
        type="button"
        style="
          width:100%;
          margin-top:15px;
          padding:14px;
          font-size:17px;
          font-weight:bold;
          border-radius:10px;
        "
      >
        ＋ เพิ่มรายการ
      </button>


      <div
        id="orderSummary"
        style="
          margin-top:20px;
          padding:15px;
          border-radius:10px;
          background:#f5f5f5;
          font-size:18px;
          font-weight:bold;
        "
      >
        รวม 0 ชุด • 0 บาท
      </div>

    </section>


    <!-- ========================= -->
    <!-- ข้อมูลลูกค้า -->
    <!-- ========================= -->

    <section class="card">

      <h2>👤 ข้อมูลลูกค้า</h2>


      <label for="customerName">
        ชื่อลูกค้า
      </label>

      <input
        id="customerName"
        type="text"
        placeholder="ชื่อ"
      >


      <label for="phone">
        📞 เบอร์โทร
      </label>

      <input
        id="phone"
        type="tel"
        placeholder="เบอร์โทรศัพท์"
      >


      <label for="address">
        📍 ที่อยู่
      </label>

      <textarea
        id="address"
        placeholder="บ้าน / ที่อยู่สำหรับจัดส่ง"
      ></textarea>


      <label for="note">
        📝 หมายเหตุ
      </label>

      <textarea
        id="note"
        placeholder="เช่น ไม่เผ็ด, โทรก่อนส่ง"
      ></textarea>


      <button
        id="submitBtn"
        type="button"
        style="
          width:100%;
          margin-top:20px;
          padding:15px;
          font-size:18px;
          font-weight:bold;
          border-radius:10px;
        "
      >
        ✅ ยืนยันสั่งซื้อ
      </button>


      <p
        id="message"
        class="message"
      ></p>

    </section>

  </main>


  <script
    type="module"
    src="app.js?v=3"
  ></script>

</body>

</html>
