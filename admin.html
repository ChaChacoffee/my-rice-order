<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>จัดการออเดอร์</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <header class="hero">
      <h1>📋 จัดการออเดอร์</h1>
      <p>สำหรับผู้ดูแลร้าน</p>
    </header>

    <section id="loginBox" class="card">

      <h2>🔐 เข้าสู่ระบบ</h2>

      <p>
        กรุณาเข้าสู่ระบบด้วย Google
      </p>

      <button id="loginBtn">
        🔐 เข้าสู่ระบบ Google
      </button>

      <p id="loginMessage" class="message"></p>

    </section>


    <section id="adminBox" class="card hidden">

      <div class="toolbar">

        <div>

          <strong id="userEmail"></strong>

          <div
            id="summary"
            class="summary"
          >
            กำลังโหลดออเดอร์...
          </div>

        </div>

        <button
          id="logoutBtn"
          class="secondary"
        >
          ออกจากระบบ
        </button>

      </div>


      <div id="orders"></div>

    </section>

  </main>


  <script
    type="module"
    src="admin.js?v=1"
  ></script>

</body>

</html>
