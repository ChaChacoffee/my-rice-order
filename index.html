<!doctype html>
<html lang="th">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>สั่งข้าวเหนียว</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main class="container">


    <!-- ========================= -->
    <!-- หัวเว็บ -->
    <!-- ========================= -->

    <header class="hero">

      <h1>🍚 สั่งข้าวเหนียว</h1>

      <p>
        เลือกเมนูที่ต้องการ
      </p>

    </header>



    <!-- ========================= -->
    <!-- ฟอร์มสั่งอาหาร -->
    <!-- ========================= -->

    <form id="orderForm">


      <!-- ========================= -->
      <!-- รายการอาหาร -->
      <!-- ========================= -->

      <section class="card">

        <h2>🛒 รายการอาหาร</h2>


        <div id="items"></div>


        <button
          id="addItemBtn"
          type="button"
          style="
            width:100%;
            margin-top:15px;
            padding:14px;
            font-size:17px;
            font-weight:bold;
            border-radius:10px;
          "
        >
          ＋ เพิ่มรายการ
        </button>


        <div
          style="
            margin-top:20px;
            padding:15px;
            border-radius:10px;
            background:#f5f5f5;
            font-size:18px;
            font-weight:bold;
          "
        >

          รวม
          <span id="total">
            0
          </span>
          บาท

        </div>

      </section>



      <!-- ========================= -->
      <!-- ข้อมูลลูกค้า -->
      <!-- ========================= -->

      <section class="card">

        <h2>👤 ข้อมูลลูกค้า</h2>


        <label for="customerName">
          ชื่อลูกค้า
        </label>

        <input
          id="customerName"
          type="text"
          placeholder="ชื่อ"
          required
        >



        <label for="phone">
          📞 เบอร์โทร
        </label>

        <input
          id="phone"
          type="tel"
          placeholder="เบอร์โทรศัพท์"
          required
        >



        <label for="address">
          📍 ที่อยู่
        </label>

        <textarea
          id="address"
          placeholder="บ้าน / ที่อยู่สำหรับจัดส่ง"
          required
        ></textarea>



        <label for="note">
          📝 หมายเหตุ
        </label>

        <textarea
          id="note"
          placeholder="หมายเหตุเพิ่มเติม"
        ></textarea>



        <button
          id="submitBtn"
          type="submit"
          style="
            width:100%;
            margin-top:20px;
            padding:15px;
            font-size:18px;
            font-weight:bold;
            border-radius:10px;
          "
        >
          ✅ ยืนยันสั่งซื้อ
        </button>


        <p
          id="message"
          class="message"
        ></p>

      </section>


    </form>


  </main>



  <!-- ========================= -->
  <!-- JavaScript -->
  <!-- ========================= -->

  <script
    type="module"
    src="app.js?v=4"
  ></script>


</body>

</html>
